name: Update blog stats

on:
  schedule:
    - cron: '7,37 * * * *'    # every 30 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  discussions: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/fetch-stats.js
      - name: Save data/stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "Update blog stats"
          git push
