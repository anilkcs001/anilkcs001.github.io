<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 760" width="660" height="760" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: webshop sends batches to an API page, records go to a staging table with checks, a posting job queue posts in the background, a retry job queue handles temporary errors, and a callback tells the webshop the result."><title>Architecture: webshop sends batches to an API page, records go to a staging table with checks, a posting job queue posts in the background, a retry job queue handles temporary errors, and a callback tells the webshop the result.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="658" height="758" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="28" y="40" font-size="19" font-weight="700" fill="#111827">How the data flows</text><rect x="16" y="60" width="628" height="330" rx="12" fill="#f8fafc"/><text x="32" y="84" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#2563eb">PART 1 · INSIDE THE API CALL · ANSWERS IN SECONDS</text><rect x="40" y="96" width="360" height="58" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="220.0" y="120.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">ABC Webshop</text><text x="220.0" y="141.5" text-anchor="middle" font-size="13.5" fill="#4b5563">sends $batch calls, max 100 records each</text><path d="M220,154 L220,186" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="188" width="360" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="214.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">API page (endpoint)</text><text x="220.0" y="235.5" text-anchor="middle" font-size="13.5" fill="#4b5563">each record carries its idempotency key</text><path d="M220,250 L220,282" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="284" width="360" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="303.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Staging table</text><text x="220.0" y="324.5" text-anchor="middle" font-size="13.5" fill="#4b5563">unique key: same record twice? refused</text><text x="220.0" y="343.5" text-anchor="middle" font-size="13.5" fill="#4b5563">check everything, collect all errors</text><text x="220.0" y="362.5" text-anchor="middle" font-size="13.5" fill="#4b5563">status code on every record</text><rect x="440" y="200" width="184" height="82" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="532.0" y="227.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Response</text><text x="532.0" y="248.0" text-anchor="middle" font-size="13.5" fill="#4b5563">Ready (0), or every</text><text x="532.0" y="267.0" text-anchor="middle" font-size="13.5" fill="#4b5563">error with its code</text><path d="M400,327 L532,327 L532,284" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><path d="M532,200 L532,125 L402,125" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="452" y="116" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">back to webshop</text><rect x="16" y="408" width="628" height="336" rx="12" fill="#f8fafc"/><text x="32" y="432" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#059669">PART 2 · IN THE BACKGROUND · EVERY FEW MINUTES</text><path d="M220,370 L220,456" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="232" y="402" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">status Ready to Post (0)</text><rect x="40" y="458" width="360" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="220.0" y="484.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Posting job queue</text><text x="220.0" y="505.5" text-anchor="middle" font-size="13.5" fill="#4b5563">Job Queue Category: one job at a time</text><path d="M220,520 L220,552" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="554" width="360" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="220.0" y="580.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">One document, one transaction</text><text x="220.0" y="601.5" text-anchor="middle" font-size="13.5" fill="#4b5563">Posted (100) or posting failed (-300)</text><rect x="440" y="554" width="184" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="532.0" y="580.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Retry job queue</text><text x="532.0" y="601.5" text-anchor="middle" font-size="13.5" fill="#4b5563">temporary errors only</text><path d="M400,585 L438,585" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><path d="M532,554 L532,489 L402,489" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="446" y="480" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">re-post later</text><path d="M220,616 L220,648" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="650" width="360" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="220.0" y="671.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Callback to the webshop</text><text x="220.0" y="692.0" text-anchor="middle" font-size="13.5" fill="#4b5563">Posted + BC document no., or Failed + reason</text><text x="220.0" y="711.0" text-anchor="middle" font-size="13.5" fill="#4b5563">task right after commit, job queue as safety net</text></svg>