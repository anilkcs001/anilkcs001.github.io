<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 800" width="660" height="800" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Posting job: take a snapshot of ready documents, then for each one commit, post it inside Codeunit.Run, mark it Posted or save the error after rollback, and continue to the next document."><title>Posting job: take a snapshot of ready documents, then for each one commit, post it inside Codeunit.Run, mark it Posted or save the error after rollback, and continue to the next document.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="658" height="798" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="28" y="40" font-size="19" font-weight="700" fill="#111827">Inside the posting job</text><rect x="150" y="62" width="360" height="48" rx="24.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="330.0" y="91.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Job queue run starts</text><path d="M330,110 L330,138" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="140" width="360" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="330.0" y="166.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">1. Take a snapshot</text><text x="330.0" y="187.5" text-anchor="middle" font-size="13.5" fill="#4b5563">collect the IDs of every Ready to Post document</text><path d="M330,202 L330,230" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="232" width="360" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="330.0" y="258.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">2. Next document: Commit()</text><text x="330.0" y="279.5" text-anchor="middle" font-size="13.5" fill="#4b5563">start every document with a clean transaction</text><path d="M330,294 L330,322" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="324" width="360" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="330.0" y="350.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">3. if Codeunit.Run(post) then</text><text x="330.0" y="371.5" text-anchor="middle" font-size="13.5" fill="#4b5563">lock this one document, check not posted, post</text><path d="M330,386 L330,410" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><polygon points="330,412.0 450.0,456 330,500.0 210.0,456" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="330" y="461" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Posted OK?</text><path d="M210,456 L148,456 L148,500" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="176" y="446" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">yes</text><path d="M450,456 L512,456 L512,500" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="470" y="446" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">no</text><rect x="36" y="502" width="224" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="148.0" y="526.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Mark Posted (100)</text><text x="148.0" y="547.5" text-anchor="middle" font-size="13.5" fill="#4b5563">save the BC document no.</text><text x="148.0" y="566.5" text-anchor="middle" font-size="13.5" fill="#4b5563">success event</text><text x="148.0" y="585.5" text-anchor="middle" font-size="13.5" fill="#4b5563">callback queued</text><rect x="400" y="502" width="224" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="512.0" y="526.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Rolled back</text><text x="512.0" y="547.5" text-anchor="middle" font-size="13.5" fill="#4b5563">only this document</text><text x="512.0" y="566.5" text-anchor="middle" font-size="13.5" fill="#4b5563">save the error (-300)</text><text x="512.0" y="585.5" text-anchor="middle" font-size="13.5" fill="#4b5563">failure event, callback queued</text><path d="M148,598 L148,632 L270,632" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><path d="M512,598 L512,632 L390,632" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><polygon points="330,624.0 450.0,662 330,700.0 210.0,662" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="330" y="667" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">More documents?</text><path d="M210,662 L16,662 L16,263 L148,263" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="28" y="654" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">yes, next one</text><path d="M330,700 L330,724" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="340" y="716" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">no</text><rect x="100" y="726" width="460" height="52" rx="26.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="330.0" y="757.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Job finishes. It never fails for one bad document.</text></svg>