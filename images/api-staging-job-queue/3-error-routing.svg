<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 770" width="660" height="770" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Error routing: temporary errors go to a retry job queue with growing waits and become Needs Attention after the maximum tries; business errors go straight to Needs Attention, where a user fixes them and reposts."><title>Error routing: temporary errors go to a retry job queue with growing waits and become Needs Attention after the maximum tries; business errors go straight to Needs Attention, where a user fixes them and reposts.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="658" height="768" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="28" y="40" font-size="19" font-weight="700" fill="#111827">When posting fails: retry or send to a person?</text><rect x="200" y="62" width="260" height="48" rx="24.0" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="330.0" y="91.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Posting failed</text><path d="M330,110 L330,132" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><polygon points="330,136.0 470.0,184 330,232.0 190.0,184" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="330" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Will retrying</text><text x="330" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">help?</text><path d="M190,184 L160,184 L160,232" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="36" y="214" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">yes, temporary</text><path d="M470,184 L500,184 L500,232" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="496" y="214" text-anchor="middle" font-size="13" font-style="italic" fill="#4b5563">no, business error</text><rect x="24" y="234" width="272" height="118" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160.0" y="269.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Temporary error</text><text x="160.0" y="290.5" text-anchor="middle" font-size="13.5" fill="#4b5563">lock timeout or deadlock</text><text x="160.0" y="309.5" text-anchor="middle" font-size="13.5" fill="#4b5563">another user changed it (409)</text><text x="160.0" y="328.5" text-anchor="middle" font-size="13.5" fill="#4b5563">429, 500, 503 or a timeout</text><rect x="364" y="234" width="272" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="500.0" y="269.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Business error</text><text x="500.0" y="290.5" text-anchor="middle" font-size="13.5" fill="#4b5563">posting date not allowed</text><text x="500.0" y="309.5" text-anchor="middle" font-size="13.5" fill="#4b5563">missing posting or GST setup</text><text x="500.0" y="328.5" text-anchor="middle" font-size="13.5" fill="#4b5563">blocked customer, item, dimension</text><path d="M160,352 L160,384" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><path d="M500,352 L500,384" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="386" width="272" height="98" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160.0" y="411.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Retry job queue</text><text x="160.0" y="432.5" text-anchor="middle" font-size="13.5" fill="#4b5563">wait 5, then 10, then 20 minutes</text><text x="160.0" y="451.5" text-anchor="middle" font-size="13.5" fill="#4b5563">Retry Count + Next Retry Time</text><text x="160.0" y="470.5" text-anchor="middle" font-size="13.5" fill="#4b5563">same category as posting</text><rect x="364" y="386" width="272" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="500.0" y="421.0" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Needs Attention</text><text x="500.0" y="442.0" text-anchor="middle" font-size="13.5" fill="#4b5563">no automatic retry</text><text x="500.0" y="461.0" text-anchor="middle" font-size="13.5" fill="#4b5563">clear message on the record</text><path d="M160,484 L160,516" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><polygon points="160,518.0 270.0,558 160,598.0 50.0,558" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160" y="563" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Posted now?</text><path d="M160,598 L160,632" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="170" y="620" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">yes</text><rect x="24" y="634" width="272" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="160.0" y="660.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Posted (100)</text><text x="160.0" y="681.5" text-anchor="middle" font-size="13.5" fill="#4b5563">callback tells the webshop</text><path d="M270,558 L430,558 L430,486" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><text x="286" y="548" text-anchor="start" font-size="13" font-style="italic" fill="#4b5563">no, after max tries</text><path d="M500,484 L500,632" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/><rect x="364" y="634" width="272" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="660.5" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">User fixes it, clicks Repost</text><text x="500.0" y="681.5" text-anchor="middle" font-size="13.5" fill="#4b5563">back to Ready to Post (0)</text></svg>