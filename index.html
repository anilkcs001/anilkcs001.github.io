<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Name · Blog</title>
  <meta name="description" content="Daily notes on issues, new features, code bits and full solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="#/" id="brand">Your Name</a>
      <nav class="nav">
        <a href="#/" data-nav="home">Posts</a>
        <a href="#/about" data-nav="about">About</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark / light theme" title="Toggle theme">◐</button>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
